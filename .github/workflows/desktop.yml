name: Desktop milestone checks
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: ['codex/cross-platform-milestone', 'codex/connection-wizard-installer']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run package:win -- $(git rev-parse HEAD)
      - run: npm run test:packaged
      - run: npm run test:instances
      - run: node tests/installer-smoke.cjs
      - name: Verify reviewed engine and version-only invocation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .userdata/engine-download | Out-Null
          $engine = Join-Path $PWD '.userdata/engine-download/rustdesk-1.5.0-x86_64.exe'
          curl.exe -L --fail --silent --show-error 'https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe' -o $engine
          if ($LASTEXITCODE -ne 0) { throw 'Official engine download failed.' }
          node tests/trusted-engine.cjs $engine --probe-version
          if ($LASTEXITCODE -ne 0) { throw 'Trusted engine verification failed.' }
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ui-evidence
          path: desktop/output/playwright/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact-head Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            desktop/dist/*-setup.exe
            desktop/dist/*-setup.exe.sha256
            desktop/dist/*-setup.exe.json
          if-no-files-found: error
          retention-days: 14
